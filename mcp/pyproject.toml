[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "networkbot-mcp"
version = "1.1.0"
description = "MCP server for Match It Up NetworkBot — browse members, get matches, post signals, send DMs, bonds, mesh threads, and more"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Match It Up", email = "hello@matchitup.in" }]
keywords = ["mcp", "networkbot", "matchitup", "claude", "anthropic", "networking", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications",
    "Topic :: Internet",
]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
networkbot-mcp = "networkbot_mcp.server:main"

[project.urls]
Homepage = "https://matchitup.in/developer-docs"
Repository = "https://github.com/kunalkhanna2007-sys/networkbot-python"
Documentation = "https://matchitup.in/developer-docs"

[tool.hatch.build.targets.wheel]
packages = ["networkbot_mcp"]
